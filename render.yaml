services:
  - type: web
    name: iou-uome
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: iou-uome-db
          property: connectionString

databases:
  - name: iou-uome-db
    databaseName: iou_uome
    user: iou_uome
    plan: free
